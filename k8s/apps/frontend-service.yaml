apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: student-enrollment
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: student-enrollment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
        app.kubernetes.io/part-of: student-enrollment
    spec:
      containers:
        - name: frontend-service
          image: student-enrollment/frontend-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_PROFILES_ACTIVE
            - name: GATEWAY_URL
              value: "http://127.0.0.1"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: student-enrollment
  labels:
    app: frontend-service
    app.kubernetes.io/part-of: student-enrollment
spec:
  selector:
    app: frontend-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

