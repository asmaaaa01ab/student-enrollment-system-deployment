# Profil k8s — activé par SPRING_PROFILES_ACTIVE=k8s
# Eureka désactivé : la découverte passe par les Services Kubernetes (DNS)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.loadbalancer.enabled=false
# Sondes Kubernetes (liveness / readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Base de données (valeurs fournies par le ConfigMap / Secret)
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
# Appel direct au Service Kubernetes (plus de lb://)
student-service.url=http://student-service:8081
