# Profil k8s — activé par SPRING_PROFILES_ACTIVE=k8s
# Eureka désactivé : la découverte passe par les Services Kubernetes (DNS)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.loadbalancer.enabled=false
# Sondes Kubernetes (liveness / readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Routes : une liste Spring est remplacée en bloc, donc on la redéfinit en entier (lb:// -> http://<service>:<port>)
spring.cloud.gateway.routes[0].id=auth-register
spring.cloud.gateway.routes[0].uri=http://auth-service:8085
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=student-service
spring.cloud.gateway.routes[1].uri=http://student-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/students/**
spring.cloud.gateway.routes[1].filters[0].name=JwtAuthFilter

spring.cloud.gateway.routes[2].id=course-service
spring.cloud.gateway.routes[2].uri=http://course-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/courses/**
spring.cloud.gateway.routes[2].filters[0].name=JwtAuthFilter

spring.cloud.gateway.routes[3].id=enrollment-service
spring.cloud.gateway.routes[3].uri=http://enrollment-service:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/enrollments/**
spring.cloud.gateway.routes[3].filters[0].name=JwtAuthFilter
