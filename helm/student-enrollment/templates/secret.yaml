{{- $db := required "Mot de passe MySQL manquant : ajoute --set secrets.dbPassword=..." .Values.secrets.dbPassword -}}
{{- $jwt := required "Secret JWT manquant : ajoute --set secrets.jwtSecret=..." .Values.secrets.jwtSecret -}}
{{- if lt (len $jwt) 32 }}
{{- fail "secrets.jwtSecret doit faire au moins 32 caractères" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: student-enrollment
type: Opaque
stringData:
  DB_PASSWORD: {{ $db | quote }}
  JWT_SECRET: {{ $jwt | quote }}
